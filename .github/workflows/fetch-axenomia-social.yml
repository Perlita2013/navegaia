name: Fetch AxenomIA social asset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-axenomia-social.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch approved AxenomIA post
        run: |
          mkdir -p social/axenomia
          curl -fL --retry 5 --retry-delay 3 \
            'https://axenomia-social-assets.onrender.com/axenomia/post-1-baseline.jpg' \
            -o social/axenomia/post-1.jpg
          file social/axenomia/post-1.jpg
      - name: Commit asset if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social/axenomia/post-1.jpg
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'chore: host AxenomIA Instagram post 1'
            git push
          fi
